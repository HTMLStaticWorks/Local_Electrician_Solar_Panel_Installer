<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Circuit Disconnected | VoltSolar Energy</title>
  <meta name="description" content="404 Page Not Found. The requested electrical circuit or page is disconnected. Return to VoltSolar homepage.">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <!-- Header Minimal -->
  <header class="site-header" style="position: relative;">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <span>Volt</span>Solar
      </a>
      <div class="header-actions">
        <button class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
      </div>
    </div>
  </header>

  <!-- 404 Main Content -->
  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-4xl) 0;">
    <div class="container text-center">
      <div style="max-width: 600px; margin: 0 auto;">
        <!-- Animated Circuit Icon -->
        <div style="width: 90px; height: 90px; border-radius: var(--radius-xl); background: var(--color-accent-light); color: #B45309; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-lg) auto;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>

        <h1 style="font-size: clamp(3.5rem, 8vw, 6rem); line-height: 1; margin-bottom: var(--space-xs); color: var(--color-accent);">404</h1>
        <h2 style="font-size: 1.85rem; margin-bottom: var(--space-md);">Looks like this circuit is disconnected.</h2>
        <p style="font-size: 1.1rem; margin-bottom: var(--space-2xl);">
          The page or circuit you are trying to reach has tripped a breaker or no longer exists. Let's reconnect your power feed.
        </p>

        <div class="btn-group" style="justify-content: center;">
          <a href="index.html" class="btn btn-primary">Back Home</a>
          <a href="services.html" class="btn btn-secondary">View Services</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Minimal -->
  <footer class="site-footer" style="padding-top: var(--space-xl); margin-top: 0;">
    <div class="container text-center">
      <p>© 2026 VoltSolar Energy Solutions. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
